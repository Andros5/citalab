name: Comprobaciones

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Pruebas y reproducción (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Pruebas automáticas
        run: python -m pytest
      - name: Código evaluado, tablas de la memoria e informe del jurado
        run: python scripts/reproduce.py

  web:
    name: Interfaz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run i18n:check
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
